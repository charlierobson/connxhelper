<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectioneer</title>
  <style>
    :root {
      --gap: 12px;
      --tile-bg: #f5f5f7;
      --tile-fg: #111827;
      --tile-active: #e0e7ff;
      --tile-border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #111; }

    .wrap { max-width: 680px; margin: 40px auto; padding: 0 16px; }

    h1 { font-size: 20px; margin: 0 0 12px; font-weight: 700; }
    p  { margin: 0 0 16px; color: #4b5563; }

    .controls { display: flex; gap: 8px; margin: 12px 0 16px; flex-wrap: wrap; }
    button { cursor: pointer; border: 1px solid #e5e7eb; background: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 600; }
    button:active { transform: translateY(1px); }

    textarea { width: 100%; height: 100px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px; font-family: inherit; resize: vertical; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
      user-select: none;
    }

    .tile {
      aspect-ratio: 1/1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      background: var(--pos-bg, var(--tile-bg));
      border: 1px solid var(--tile-border);
      color: var(--tile-fg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease, outline-color .12s ease;
      touch-action: none; /* Prevent default scrolling during drag */
    }

    /* Tile text sizing: allow wrapping so sentences can be larger */
    .tile .tile-text {
      display: block;
      width: 100%;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      font-size: clamp(14px, 3.8vmin, 22px);
      line-height: 1.1;
      padding: 0 4px;
    }

    /* Color modes: row-based (default) and column-based (rotated) */
    /* Exact hex values sampled from the provided screenshot (applied to positions) */
    .grid.color-mode-row .tile.row-0 { --pos-bg: #C084FC; }
    .grid.color-mode-row .tile.row-1 { --pos-bg: #93C5FD; }
    .grid.color-mode-row .tile.row-2 { --pos-bg: #A7F3D0; }
    .grid.color-mode-row .tile.row-3 { --pos-bg: #FDE68A; }

    .grid.color-mode-col .tile.col-0 { --pos-bg: #C084FC; }
    .grid.color-mode-col .tile.col-1 { --pos-bg: #93C5FD; }
    .grid.color-mode-col .tile.col-2 { --pos-bg: #A7F3D0; }
    .grid.color-mode-col .tile.col-3 { --pos-bg: #FDE68A; }

    .tile[draggable="true"] { cursor: grab; }
    .tile.dragging { opacity: .6; transform: scale(.98); }
    .tile.drop-target { outline: 3px dashed #93c5fd; outline-offset: -6px; }
    .tile.selected { background: var(--tile-active); box-shadow: 0 4px 14px rgba(0,0,0,.08); }

    footer { margin-top: 16px; font-size: 12px; color: #6b7280; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 6px; border: 1px solid #e5e7eb; }
    /* Checkbox overlays for columns (bottom) and rows (right) */
    .grid-wrap { display: block; width: 100%; position: relative; }
    .grid { width: 100%; }
    .col-checks-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -44px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      justify-items: center;
      align-items: center;
    }
    .row-checks-right {
      position: absolute;
      top: 0;
      bottom: -0px;
      right: -44px;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
      align-items: center;
      justify-items: center;
      z-index: 10;
    }
    .col-checks-bottom input,
    .row-checks-right input {
      width: 20px;
      height: 20px;
      transform: translateY(0);
    }

    /* On small screens keep right checks inside the viewport */
    @media (max-width: 640px) {
      .row-checks-right {
        right: 8px;
      }
      .col-checks-bottom {
        bottom: -64px;
      }
      .col-checks-bottom input,
      .row-checks-right input {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Connectioneer</h1>

    <textarea id="inputText" placeholder="Paste your lines here..."></textarea>

    <div class="controls">
      <button id="loadBtn" aria-label="Load tiles from text">Load Tiles</button>
      <button id="shuffleBtn" aria-label="Shuffle tiles">Shuffle</button>
      <button id="rotateBtn" aria-pressed="false" aria-label="Rotate colors 90 degrees">Rotate Colors</button>
      <button id="swapBtn" disabled aria-label="Swap selected rows or columns">Swap</button>
    </div>

    <div class="grid-wrap" style="position:relative; display:inline-block;">
      <div id="grid" class="grid" role="list" aria-label="Reorderable grid of tiles"></div>

      <!-- Bottom: column checkboxes (centered under each column) -->
      <div class="col-checks-bottom" aria-hidden="false">
        <input type="checkbox" class="col-check" data-col="0">
        <input type="checkbox" class="col-check" data-col="1">
        <input type="checkbox" class="col-check" data-col="2">
        <input type="checkbox" class="col-check" data-col="3">
      </div>

      <!-- Right: row checkboxes (centered beside each row) -->
      <div class="row-checks-right" aria-hidden="false">
        <input type="checkbox" class="row-check" data-row="0">
        <input type="checkbox" class="row-check" data-row="1">
        <input type="checkbox" class="row-check" data-row="2">
        <input type="checkbox" class="row-check" data-row="3">
      </div>
    </div>

  </div>

  <script>
    (function() {
      const grid = document.getElementById('grid');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const loadBtn = document.getElementById('loadBtn');
      const inputText = document.getElementById('inputText');
      const rotateBtn = document.getElementById('rotateBtn');
      const swapBtn = document.getElementById('swapBtn');

      const rowChecks = Array.from(document.querySelectorAll('.row-check'));
      const colChecks = Array.from(document.querySelectorAll('.col-check'));


      const defaultOrder = Array.from({ length: 16 }, () => "");
      let originalOrder = [...defaultOrder];
      let currentOrder = [...originalOrder];
      let clickSelected = null;
      let kbSelected = null;

      // Color palette (exact screenshot hexes) and rotation state
      const colors = ['#C084FC', '#93C5FD', '#A7F3D0', '#FDE68A'];
      // rotation = number of 90° CCW rotations applied to the color field
      let rotation = 0;

      function render(order) {
        grid.innerHTML = '';
        order.forEach((text, i) => {
          const tile = document.createElement('div');
          tile.className = 'tile';
          // Position classes so colors stay bound to grid positions
          const row = Math.floor(i / 4);
          const col = i % 4;
          tile.classList.add(`row-${row}`, `col-${col}`);
          tile.setAttribute('role', 'listitem');
          tile.setAttribute('tabindex', '0');
          tile.setAttribute('draggable', 'true');
          tile.dataset.index = i;

          // Use inner span for text so we can control sizing
          const span = document.createElement('span');
          span.className = 'tile-text';
          span.textContent = text;
          tile.appendChild(span);

          // compute per-position color based on current rotation
          const computeRotatedRow = (r, c, rot) => {
            let rr = r, cc = c;
            for (let k = 0; k < rot; k++) {
              const tmp = rr;
              rr = cc;
              cc = 3 - tmp;
            }
            return rr;
          };

          const rr = computeRotatedRow(row, col, rotation);
          const colorIndex = 3 - rr; // base mapping: bottom row -> purple (index 0)
          const color = colors[(colorIndex + colors.length) % colors.length];
          tile.style.setProperty('--pos-bg', color);

          tile.addEventListener('dragstart', e => {
            tile.classList.add('dragging');
            e.dataTransfer.setData('text/plain', tile.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
          });
          tile.addEventListener('dragend', () => tile.classList.remove('dragging'));
          tile.addEventListener('dragover', e => { e.preventDefault(); tile.classList.add('drop-target'); });
          tile.addEventListener('dragleave', () => tile.classList.remove('drop-target'));
          tile.addEventListener('drop', e => {
            e.preventDefault();
            tile.classList.remove('drop-target');
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const toIndex = parseInt(tile.dataset.index);
            swapValues(fromIndex, toIndex);
          });

          // Touch support: drag simulation with touchmove
          let touchId = null;
          tile.addEventListener('touchstart', e => {
            if (touchId !== null) return;
            touchId = e.changedTouches[0].identifier;
            tile.classList.add('dragging');
          });

          tile.addEventListener('touchmove', e => {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropTile = target && target.closest('.tile');
            grid.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            if (dropTile && dropTile !== tile) {
              dropTile.classList.add('drop-target');
            }
          });

          tile.addEventListener('touchend', e => {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropTile = target && target.closest('.tile');
            grid.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            tile.classList.remove('dragging');
            if (dropTile && dropTile !== tile) {
              const fromIndex = parseInt(tile.dataset.index);
              const toIndex = parseInt(dropTile.dataset.index);
              swapValues(fromIndex, toIndex);
            }
            touchId = null;
          });

          tile.addEventListener('click', () => {
            if (!clickSelected) {
              clickSelected = tile;
              tile.classList.add('selected');
            } else if (clickSelected === tile) {
              tile.classList.remove('selected');
              clickSelected = null;
            } else {
              const fromIndex = parseInt(clickSelected.dataset.index);
              const toIndex = parseInt(tile.dataset.index);
              clickSelected.classList.remove('selected');
              clickSelected = null;
              swapValues(fromIndex, toIndex);
            }
          });

          tile.addEventListener('keydown', e => {
            const index = Array.from(grid.children).indexOf(tile);

            if (e.code === 'Space') {
              e.preventDefault();
              if (kbSelected === tile) { tile.classList.remove('selected'); kbSelected = null; }
              else { if (kbSelected) kbSelected.classList.remove('selected'); kbSelected = tile; tile.classList.add('selected'); }
            }

            if (e.code === 'Enter' && kbSelected && kbSelected !== tile) {
              e.preventDefault();
              swapValues(parseInt(kbSelected.dataset.index), parseInt(tile.dataset.index));
              kbSelected.classList.remove('selected');
              kbSelected = null;
            }

            const moveFocus = (newIndex) => {
              const el = grid.children[newIndex];
              if (el) el.focus();
            };

            switch (e.code) {
              case 'ArrowRight': e.preventDefault(); moveFocus(Math.min(index + 1, 15)); break;
              case 'ArrowLeft':  e.preventDefault(); moveFocus(Math.max(index - 1, 0)); break;
              case 'ArrowDown':  e.preventDefault(); moveFocus(Math.min(index + 4, 15)); break;
              case 'ArrowUp':    e.preventDefault(); moveFocus(Math.max(index - 4, 0)); break;
            }
          });

          grid.appendChild(tile);

          // Autosize fallback: reduce font-size until text fits both width and height (stop at 8px)
          try {
            const style = window.getComputedStyle(span);
            let fs = parseFloat(style.fontSize) || 16;
            span.style.fontSize = fs + 'px';
            const maxH = tile.clientHeight - 8; // leave a bit of padding
            while ((span.scrollHeight > maxH || span.scrollWidth > span.clientWidth) && fs > 8) {
              fs = Math.max(8, fs - 1);
              span.style.fontSize = fs + 'px';
            }
          } catch (e) {
            // ignore sizing errors
          }
        });
      }

      function swapValues(aIndex, bIndex) {
        if (aIndex === bIndex) return;
        const tmp = currentOrder[aIndex];
        currentOrder[aIndex] = currentOrder[bIndex];
        currentOrder[bIndex] = tmp;
        render(currentOrder);
      }

      function swapRows(r1, r2) {
        for (let c = 0; c < 4; c++) {
          const i1 = r1 * 4 + c;
          const i2 = r2 * 4 + c;
          [currentOrder[i1], currentOrder[i2]] = [currentOrder[i2], currentOrder[i1]];
        }
        render(currentOrder);
      }

      function swapCols(c1, c2) {
        for (let r = 0; r < 4; r++) {
          const i1 = r * 4 + c1;
          const i2 = r * 4 + c2;
          [currentOrder[i1], currentOrder[i2]] = [currentOrder[i2], currentOrder[i1]];
        }
        render(currentOrder);
      }

      function updateSwapState() {
        const checkedRows = rowChecks.filter(cb => cb.checked).map(cb => parseInt(cb.dataset.row));
        const checkedCols = colChecks.filter(cb => cb.checked).map(cb => parseInt(cb.dataset.col));
        const rowsOk = checkedRows.length === 2 && checkedCols.length === 0;
        const colsOk = checkedCols.length === 2 && checkedRows.length === 0;
        swapBtn.disabled = !(rowsOk || colsOk);
      }

      rowChecks.forEach(cb => cb.addEventListener('change', () => { colChecks.forEach(c => c.checked = false); updateSwapState(); }));
      colChecks.forEach(cb => cb.addEventListener('change', () => { rowChecks.forEach(r => r.checked = false); updateSwapState(); }));

      if (swapBtn) {
        swapBtn.addEventListener('click', () => {
          const checkedRows = rowChecks.filter(cb => cb.checked).map(cb => parseInt(cb.dataset.row));
          const checkedCols = colChecks.filter(cb => cb.checked).map(cb => parseInt(cb.dataset.col));
          if (checkedRows.length === 2 && checkedCols.length === 0) {
            swapRows(checkedRows[0], checkedRows[1]);
            // clear selections
            rowChecks.forEach(cb => cb.checked = false);
            updateSwapState();
          } else if (checkedCols.length === 2 && checkedRows.length === 0) {
            swapCols(checkedCols[0], checkedCols[1]);
            colChecks.forEach(cb => cb.checked = false);
            updateSwapState();
          }
        });
      }

      function shuffle() {
        const arr = [...currentOrder];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        currentOrder = arr;
        render(currentOrder);
      }

      /* reset() removed — Reset button and behavior intentionally removed */

      function loadFromText() {
        let lines = inputText.value.split(/\n/).map(l => l.trim()).filter(l => l !== '');
        if (lines.length > 16) lines = lines.slice(0, 16);
        while (lines.length < 16) lines.push("");
        originalOrder = [...lines];
        currentOrder = [...lines];
        render(currentOrder);
      }

      /* clearAll() removed — Clear button and behavior intentionally removed */

      shuffleBtn.addEventListener('click', shuffle);
      loadBtn.addEventListener('click', loadFromText);
      if (rotateBtn) {
        rotateBtn.addEventListener('click', () => {
          rotation = (rotation + 1) % 4; // rotate color field 90° CCW
          // aria-pressed reflects that we're in a rotated state (non-zero)
          rotateBtn.setAttribute('aria-pressed', String(rotation !== 0));
          render(currentOrder);
        });
      }

      updateSwapState();
      render(currentOrder);
    })();
  </script>
</body>
</html>
