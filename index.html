<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectioneer</title>
  <style>
    :root {
      --gap: 12px;
      --tile-bg: #f5f5f7;
      --tile-fg: #111827;
      --tile-active: #e0e7ff;
      --tile-border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #111; }

    .wrap { max-width: 680px; margin: 40px auto; padding: 0 16px; }

    h1 { font-size: 20px; margin: 0 0 12px; font-weight: 700; }
    p  { margin: 0 0 16px; color: #4b5563; }

    .controls { display: flex; gap: 8px; margin: 12px 0 16px; flex-wrap: wrap; }
    button { cursor: pointer; border: 1px solid #e5e7eb; background: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 600; }
    button:active { transform: translateY(1px); }

    textarea { width: 100%; height: 100px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px; font-family: inherit; resize: vertical; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
      user-select: none;
      width: 100%;
    }

    .tile {
      aspect-ratio: 1/1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      background: var(--pos-bg, var(--tile-bg));
      border: 1px solid var(--tile-border);
      color: var(--tile-fg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease, outline-color .12s ease;
      touch-action: none; /* Allow touch drag handling */
    }

    /* Tile text sizing: allow wrapping so sentences can be larger */
    .tile .tile-text {
      display: block;
      width: 100%;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      font-size: clamp(14px, 3.8vmin, 22px);
      line-height: 1.1;
      padding: 0 4px;
    }

    /* Drag visuals and selected state */
    .tile[draggable="true"] { cursor: grab; }
    .tile.dragging { opacity: .6; transform: scale(.98); }
    .tile.drop-target { outline: 3px dashed #93c5fd; outline-offset: -6px; }
    .tile.selected { background: var(--tile-active); box-shadow: 0 4px 14px rgba(0,0,0,.08); }

    .grid-wrap { display: block; width: 100%; position: relative; }

    footer { margin-top: 16px; font-size: 12px; color: #6b7280; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 6px; border: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Connectioneer</h1>

    <textarea id="inputText" placeholder="Paste your lines here..."></textarea>

    <div class="controls">
      <button id="loadBtn" aria-label="Load tiles from text">Load Tiles</button>
      <button id="shuffleBtn" aria-label="Shuffle tiles">Shuffle</button>
      <button id="rotateBtn" aria-pressed="false" aria-label="Rotate colors 90 degrees">Rotate Colors</button>
    </div>

    <div class="grid-wrap" style="position:relative; display:inline-block;">
      <div id="grid" class="grid" role="list" aria-label="Reorderable grid of tiles"></div>
    </div>

  </div>

  <script>
    (function() {
      const grid = document.getElementById('grid');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const loadBtn = document.getElementById('loadBtn');
      const inputText = document.getElementById('inputText');
      const rotateBtn = document.getElementById('rotateBtn');

      const defaultOrder = Array.from({ length: 16 }, () => "");
      let originalOrder = [...defaultOrder];
      let currentOrder = [...originalOrder];
      let clickSelected = null;
      let kbSelected = null;

      // Color palette (exact screenshot hexes) and rotation state
      const colors = ['#C084FC', '#93C5FD', '#A7F3D0', '#FDE68A'];
      // rotation = number of 90° CCW rotations applied to the color field
      let rotation = 0;

      // compute per-position rotated row after `rotation` CCW steps
      function computeRotatedRow(r, c, rot) {
        let rr = r, cc = c;
        for (let k = 0; k < rot; k++) {
          const tmp = rr;
          rr = cc;
          cc = 3 - tmp;
        }
        return rr;
      }

      function render(order) {
        grid.innerHTML = '';
        order.forEach((text, i) => {
          const tile = document.createElement('div');
          tile.className = 'tile';
          // Position classes so colors stay bound to grid positions
          const row = Math.floor(i / 4);
          const col = i % 4;
          tile.classList.add(`row-${row}`, `col-${col}`);
          tile.setAttribute('role', 'listitem');
          tile.setAttribute('tabindex', '0');

          // Use inner span for text so we can control sizing
          const span = document.createElement('span');
          span.className = 'tile-text';
          span.textContent = text;
          tile.appendChild(span);

          // compute per-position color based on current rotation
          const rr = computeRotatedRow(row, col, rotation);
          const colorIndex = 3 - rr; // base mapping: bottom row -> purple (index 0)
          const color = colors[(colorIndex + colors.length) % colors.length];
          tile.style.setProperty('--pos-bg', color);

          // enable tile-level swapping (drag, touch, click, keyboard)
          tile.setAttribute('draggable', 'true');
          tile.dataset.index = i;

          tile.addEventListener('dragstart', e => {
            tile.classList.add('dragging');
            e.dataTransfer.setData('text/plain', tile.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
          });
          tile.addEventListener('dragend', () => tile.classList.remove('dragging'));
          tile.addEventListener('dragover', e => { e.preventDefault(); tile.classList.add('drop-target'); });
          tile.addEventListener('dragleave', () => tile.classList.remove('drop-target'));
          tile.addEventListener('drop', e => {
            e.preventDefault();
            tile.classList.remove('drop-target');
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const toIndex = parseInt(tile.dataset.index);
            swapValues(fromIndex, toIndex);
          });

          // Touch support: drag simulation with touchmove
          let touchId = null;
          tile.addEventListener('touchstart', e => {
            if (touchId !== null) return;
            touchId = e.changedTouches[0].identifier;
            tile.classList.add('dragging');
          });

          tile.addEventListener('touchmove', e => {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropTile = target && target.closest('.tile');
            grid.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            if (dropTile && dropTile !== tile) {
              dropTile.classList.add('drop-target');
            }
          });

          tile.addEventListener('touchend', e => {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropTile = target && target.closest('.tile');
            grid.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            tile.classList.remove('dragging');
            if (dropTile && dropTile !== tile) {
              const fromIndex = parseInt(tile.dataset.index);
              const toIndex = parseInt(dropTile.dataset.index);
              swapValues(fromIndex, toIndex);
            }
            touchId = null;
          });

          tile.addEventListener('click', () => {
            if (!clickSelected) {
              clickSelected = tile;
              tile.classList.add('selected');
            } else if (clickSelected === tile) {
              tile.classList.remove('selected');
              clickSelected = null;
            } else {
              const fromIndex = parseInt(clickSelected.dataset.index);
              const toIndex = parseInt(tile.dataset.index);
              clickSelected.classList.remove('selected');
              clickSelected = null;
              swapValues(fromIndex, toIndex);
            }
          });

          tile.addEventListener('keydown', e => {
            const index = Array.from(grid.children).indexOf(tile);

            if (e.code === 'Space') {
              e.preventDefault();
              if (kbSelected === tile) { tile.classList.remove('selected'); kbSelected = null; }
              else { if (kbSelected) kbSelected.classList.remove('selected'); kbSelected = tile; tile.classList.add('selected'); }
            }

            if (e.code === 'Enter' && kbSelected && kbSelected !== tile) {
              e.preventDefault();
              swapValues(parseInt(kbSelected.dataset.index), parseInt(tile.dataset.index));
              kbSelected.classList.remove('selected');
              kbSelected = null;
            }

            const moveFocus = (newIndex) => {
              const el = grid.children[newIndex];
              if (el) el.focus();
            };

            switch (e.code) {
              case 'ArrowRight': e.preventDefault(); moveFocus(Math.min(index + 1, 15)); break;
              case 'ArrowLeft':  e.preventDefault(); moveFocus(Math.max(index - 1, 0)); break;
              case 'ArrowDown':  e.preventDefault(); moveFocus(Math.min(index + 4, 15)); break;
              case 'ArrowUp':    e.preventDefault(); moveFocus(Math.max(index - 4, 0)); break;
            }
          });

          grid.appendChild(tile);

          // Autosize: shrink text so the widest word fits the tile width
          try {
            const style = window.getComputedStyle(span);
            let fs = parseFloat(style.fontSize) || 16;
            span.style.fontSize = fs + 'px';

            const paddingH = 8; // leave a bit of padding vertically
            const tileInnerW = tile.clientWidth - 8; // horizontal padding allowance
            const maxH = tile.clientHeight - paddingH;

            // create a hidden measuring span to measure words without wrapping
            const meas = document.createElement('span');
            meas.style.position = 'absolute';
            meas.style.visibility = 'hidden';
            meas.style.whiteSpace = 'nowrap';
            meas.style.fontFamily = style.fontFamily;
            meas.style.fontWeight = style.fontWeight;
            document.body.appendChild(meas);

            const words = (text || '').toString().split(/\s+/).filter(Boolean);
            const widestWord = words.reduce((a, b) => (a.length >= b.length ? a : b), words[0] || '');

            // shrink until the widest word fits in one line and total height fits
            while (fs > 8) {
              meas.style.fontSize = fs + 'px';
              let widest;
              if (widestWord) {
                meas.textContent = widestWord;
                widest = meas.offsetWidth;
              } else {
                widest = 0;
              }
              span.style.fontSize = fs + 'px';
              // if widest word fits and the span height fits, we're good
              if ((widest <= tileInnerW || widestWord === '') && span.scrollHeight <= maxH) break;
              fs = Math.max(8, fs - 1);
            }

            document.body.removeChild(meas);
          } catch (e) {
            // ignore sizing errors
          }
        });
      }

      function swapValues(aIndex, bIndex) {
        if (aIndex === bIndex) return;
        const tmp = currentOrder[aIndex];
        currentOrder[aIndex] = currentOrder[bIndex];
        currentOrder[bIndex] = tmp;
        render(currentOrder);
      }

      function shuffle() {
        const arr = [...currentOrder];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        currentOrder = arr;
        render(currentOrder);
      }

      function loadFromText() {
        let lines = inputText.value.split(/\n/).map(l => l.trim()).filter(l => l !== '');
        if (lines.length > 16) lines = lines.slice(0, 16);
        while (lines.length < 16) lines.push("");
        originalOrder = [...lines];
        currentOrder = [...lines];
        render(currentOrder);
        // Clear the input textarea after loading
        inputText.value = '';
      }

      shuffleBtn.addEventListener('click', shuffle);
      loadBtn.addEventListener('click', loadFromText);
      if (rotateBtn) {
        rotateBtn.addEventListener('click', () => {
          rotation = (rotation + 1) % 4; // rotate color field 90° CCW
          // aria-pressed reflects that we're in a rotated state (non-zero)
          rotateBtn.setAttribute('aria-pressed', String(rotation !== 0));
          render(currentOrder);
        });
      }

      try {
        render(currentOrder);
      } catch (err) {
        console.error('Render error', err);
        grid.textContent = 'Render error — check console for details';
      }
    })();
  </script>
</body>
</html>
